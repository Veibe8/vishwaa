<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi Babeeey 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Dancing Script', cursive;
      height: 100%;
      background: pink;
      color: white;
      font-size: 7vw;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.6s ease;
    }

    .message-container {
      position: absolute;
      width: 80%;
      transition: transform 0.6s ease, opacity 0.6s ease;
      will-change: transform, opacity;
      padding: 0 5vw;
    }

    .slide-out {
      transform: translateX(-100%);
      opacity: 0;
    }

    .slide-in {
      transform: translateX(100%);
      opacity: 0;
    }

    .active {
      transform: translateX(0%);
      opacity: 1;
    }
  </style>
</head>
<body onclick="nextPage()">
  <div id="message1" class="message-container active">Hi babeeey 💗</div>
  <div id="message2" class="message-container"></div>

  <script>
    const messages = [
      "Hi babeeey 💗",
      "Hi Vishwa 🌸",
      "If you were words on a page, you'd be fine print ✨",
      "They say nothing lasts forever. Want to be my nothing? 💍",
      "Do you have a map? I just got lost in your eyes 😵‍💫💘",
      "😆♥️",
      "Babyeeee ♥️"
    ];

    const colors = ["pink", "#f06292", "#ba68c8", "#f48fb1", "#ce93d8", "#81d4fa", "#f06292"];
    let currentIndex = 0;
    let showingFirst = true;

    function nextPage() {
      if (currentIndex >= messages.length - 1) return;

      const currentMsg = document.getElementById(showingFirst ? 'message1' : 'message2');
      const nextMsg = document.getElementById(showingFirst ? 'message2' : 'message1');

      currentMsg.classList.remove('active');
      currentMsg.classList.add('slide-out');

      nextMsg.textContent = messages[currentIndex + 1];
      nextMsg.classList.remove('slide-in');
      nextMsg.classList.add('active');

      document.body.style.background = colors[currentIndex + 1] || "pink";

      setTimeout(() => {
        currentMsg.className = 'message-container slide-in';
        nextMsg.className = 'message-container active';
      }, 600);

      currentIndex++;
      showingFirst = !showingFirst;
    }
  </script>
</body>
</html>
